<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VELOCITY: SHIFT — a first-person movement game. Sprint, slide, dash, wall-run and chain it all together." />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VELOCITY: SHIFT</title>
    <style>
      /* Instant shell: painted before any JavaScript loads */
      html, body { margin: 0; height: 100%; background: #0b0d14; color: #f4f1ea; overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #shell { position: fixed; inset: 0; display: grid; place-items: center; font-family: system-ui, sans-serif;
        background: radial-gradient(120% 90% at 50% 110%, #ff9a3c22, transparent 60%), linear-gradient(#0b0d14, #141a2a); z-index: 5; }
      #shell h1 { font-size: clamp(28px, 6vw, 72px); letter-spacing: 0.08em; margin: 0 0 22px; font-weight: 800; }
      #shell h1 span { color: #ff9a3c; }
      #shell .bar { width: min(420px, 60vw); height: 3px; background: #ffffff1c; margin: 0 auto; overflow: hidden; }
      #shell .bar i { display: block; height: 100%; width: 30%; background: #ff9a3c; animation: sh 1.1s ease-in-out infinite; }
      #shell p { opacity: 0.55; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; margin-top: 16px; }
      @keyframes sh { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="shell">
      <div>
        <h1>VELOCITY<span>:</span> SHIFT</h1>
        <div class="bar"><i></i></div>
        <p>Loading</p>
      </div>
    </div>
    <div id="ui"></div>
    <noscript><p style="position:fixed;inset:0;display:grid;place-items:center">VELOCITY: SHIFT needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
